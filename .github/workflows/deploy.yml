name: Deploy Quartz site to webghost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to webghost
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WEBGHOST_HOST }}
          username: blake
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/sites/quartz/miss-melon
            git pull origin main
            npm ci
            npx quartz build
            systemctl --user restart miss-melon
